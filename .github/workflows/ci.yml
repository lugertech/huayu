name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          node-version: "24.22.1"
          cache: true
          run-install: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.95.0
      - run: vp install --frozen-lockfile
      - run: vp run check:release
      - run: vp run licenses:check
      - run: vp run check
      - run: vp run test
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/api-rust/Cargo.toml --all -- --check
      - name: Rust lint
        run: vp run lint:rust
      - run: vp run build:web
      - run: vp run build:site
      - run: vp run package:source

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          node-version: "24.22.1"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp pm audit --prod --audit-level high
