[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/huayu-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Adapted from BeautifulRust (MIT); see CODE_STYLE.md and ../../licenses/BeautifulRust-MIT.txt.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs", "limit", "compression-gzip"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
url = "2"
futures-util = "0.3"
mime_guess = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
calamine = "0.36"
pdf-extract = "0.10"
scraper = "0.25"
tempfile = "3"
tokio-tungstenite = "0.29"
huayu-core = { path = "crates/huayu-core" }
huayu-store = { path = "crates/huayu-store" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
