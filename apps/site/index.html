<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="开源的 AI 创作画布。在本地整理素材、连接模型，生成文字、图片和网页，再沿着作品继续编辑与创作。" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>画语 · 开源的 AI 创作画布</title>
    <!--site-head-->
    <script>
      try {
        const base = '%BASE_URL%';
        if (location.pathname === base || location.pathname === base + 'index.html') {
          let saved = null;
          try { saved = localStorage.getItem('huayu:language'); } catch {}
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
          const matched = languages.find(value => /^(zh|en)(-|$)/i.test(value));
          const language = saved === 'en' || saved === 'zh-CN' ? saved : /^zh(-|$)/i.test(matched || '') ? 'zh-CN' : 'en';
          if (language === 'en') location.replace(base + 'en/' + location.search + location.hash);
        }
      } catch {}
      try {
        const theme = localStorage.getItem('huayu:site-theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--site-content--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
