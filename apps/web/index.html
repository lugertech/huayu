<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="画语是开源的 AI 创作画布。在本地整理素材、连接模型，创作文字、图片和网页。" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>画语</title>
    <script>
      try {
        const theme = localStorage.getItem('huayu:theme') || 'system';
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
